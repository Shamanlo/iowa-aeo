name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: iowa-aeo
      DOMAIN: iowaaeo.com
    steps:
      - uses: actions/checkout@v5

      - name: Check Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN under Settings > Secrets and variables > Actions"
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build site
        run: python3 build.py

      - name: Find Cloudflare account
        run: python3 tools/cloudflare_setup.py account

      - name: Create Pages project
        run: python3 tools/cloudflare_setup.py project

      - name: Deploy
        run: npx --yes wrangler@4.140.0 pages deploy docs --project-name "$PROJECT" --branch main --commit-dirty=true

      - name: Connect iowaaeo.com
        run: python3 tools/cloudflare_setup.py domains

      - name: Create podcast Pages project
        run: PROJECT=blue-collar-media python3 tools/cloudflare_setup.py project

      - name: Deploy podcasts
        run: npx --yes wrangler@4.140.0 pages deploy podcast/public --project-name blue-collar-media --branch main --commit-dirty=true
